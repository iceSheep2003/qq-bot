[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kinna-bot"
version = "0.1.0"
description = "Kinna bot: a skill-driven QQ companion for group and private chat over OneBot v11"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13,<17",
    "httpx>=0.27,<1",
    "croniter>=2,<7",
    "Markdown>=3.7,<4",
    "jsonschema>=4.23,<5",
    "instructor==1.17.0",
]

[project.optional-dependencies]
exam-poster = ["pillow>=10,<13"]

[project.scripts]
qqbot = "qqbot.bootstrap.app:main"
kinna-bot = "qqbot.bootstrap.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qqbot*"]
namespaces = false

[tool.setuptools.package-data]
"qqbot.interfaces.webui" = ["static/*", "docs/*.md"]
"qqbot.agent.identity.guard" = ["rules.json"]
"qqbot.features.slang" = ["data/*.txt", "data/*.json"]
"qqbot.features.scheduled_chat" = ["data/*.json"]
