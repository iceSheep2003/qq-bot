name: Code Quality Gate
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Prepare locked project toolchains
        run: sh .code-quality-gate/ci-setup.sh
      - run: node .code-quality-gate/toolchain/node_modules/code-quality-gate/src/cli.mjs gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-quality-gate-report
          path: .quality/code-quality-gate/
