<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef5ff">
  <title>QunBot Console</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="login" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="brand-mark">Q</div>
      <p class="eyebrow">OWNER CONSOLE</p>
      <h1>欢迎回来</h1>
      <p class="muted">使用本地 WebUI 密钥进入 QunBot 控制台。</p>
      <label class="field-label" for="token">登录密钥</label>
      <input id="token" type="password" autocomplete="current-password" placeholder="BOT_WEBUI_TOKEN" required autofocus>
      <button class="button primary wide" type="submit">进入控制台</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="app" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark small">Q</span><span><b>QunBot</b><small>Companion Console</small></span></div>
      <nav id="nav" aria-label="配置分区"></nav>
      <div class="sidebar-foot"><span class="signal-dot"></span><span><b>仅限本机</b><small>127.0.0.1 安全边界</small></span></div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow">CONFIGURATION</p><h1>机器人控制台</h1></div>
        <div class="top-actions">
          <label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索配置…"></label>
          <button id="save" class="button primary" type="button">保存更改</button>
        </div>
      </header>

      <div id="restart-banner" class="banner hidden"><b>配置已写入</b><span>重启 Bot 后生效，当前进程不会被热修改。</span></div>

      <section id="content" class="content"></section>
    </main>
    <div id="toast" class="toast" role="status"></div>
    <dialog id="detail-dialog" class="detail-dialog">
      <div class="dialog-head"><div><p class="eyebrow">DETAIL</p><h2 id="detail-title">详情</h2></div><button id="detail-close" class="icon-button" aria-label="关闭">×</button></div>
      <div id="detail-content" class="dialog-content"></div>
    </dialog>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
